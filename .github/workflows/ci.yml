name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: ["22", "24"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.2.19" }
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bunx tsc --noEmit -p tsconfig.json
      - run: node --test --experimental-test-coverage --test-coverage-include='src/**' --test-coverage-exclude='src/arag/mock/fixtures.ts' --test-coverage-lines=80 'test/**/*.test.ts'
      - run: bun audit || true
